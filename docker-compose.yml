services:
  zammad-mobile:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/zammad/}
        VITE_API_BASE: ${VITE_API_BASE:-/zammad-api}
        VITE_AUTO_REFRESH_SECONDS: ${VITE_AUTO_REFRESH_SECONDS:-60}
    env_file:
      - .env
    environment:
      HOST: ${HOST:-0.0.0.0}
    ports:
      - "${DOCKER_BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-3001}:${PORT:-3001}"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:${PORT:-3001}/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
